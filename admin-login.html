<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hızır Game Arena - Yönetim Paneli</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #070707;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      padding: 20px;
    }

    .panel {
      width: 100%;
      max-width: 620px;
      background: #111;
      border: 2px solid #ffcc00;
      border-radius: 28px;
      padding: 42px;
      box-shadow: 0 0 35px rgba(255, 204, 0, .15);
    }

    .mini {
      color: #ffcc00;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 54px;
      margin: 10px 0 12px;
    }

    p {
      color: #aaa;
      font-size: 18px;
    }

    label {
      display: block;
      margin-top: 30px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      border: 2px solid #ffcc00;
      background: #181818;
      color: #fff;
      font-size: 18px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 18px;
      border: 0;
      border-radius: 16px;
      background: #ffcc00;
      color: #080808;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    #message {
      margin-top: 20px;
      font-weight: bold;
    }

    .error {
      color: #ff4d4d;
    }

    .success {
      color: #39d98a;
    }
  </style>
</head>

<body>

  <div class="panel">
    <div class="mini">Güvenli Giriş</div>

    <h1>Yönetim paneli</h1>

    <p>Site içeriklerini değiştirmek için yönetici şifreni gir.</p>

    <form id="loginForm">
      <label for="password">Yönetici şifresi</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Giriş Yap</button>

      <div id="message"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const passwordInput = document.getElementById("password");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      message.className = "";
      message.textContent = "Kontrol ediliyor...";

      try {
        const response = await fetch("/api/admin-login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password: passwordInput.value
          })
        });

        const data = await response.json();

        if (!response.ok) {
          message.className = "error";
          message.textContent = data.error || "Giriş başarısız.";
          return;
        }

        if (!data.token) {
          message.className = "error";
          message.textContent = "Giriş anahtarı alınamadı.";
          return;
        }

        localStorage.setItem("hizir_admin_token", data.token);

        message.className = "success";
        message.textContent = "Giriş başarılı ✓";

        window.location.href = "/admin.html";

      } catch (error) {
        message.className = "error";
        message.textContent = "Sunucuya bağlanılamadı.";
      }
    });
  </script>

</body>
</html>
